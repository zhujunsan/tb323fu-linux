# SPDX-License-Identifier: MIT
name: san-flavored autofocus
on:
  push:
    branches: [san-flavored]
    paths: ['custom/libcamera/**', 'custom/version.json', 'custom-build/ci/build-libcamera.sh', 'custom-build/scripts/audit-libcamera.py', '.github/workflows/custom-libcamera.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: custom-libcamera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  libcamera:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    timeout-minutes: 90
    steps:
      - name: Install source and packaging tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates curl dpkg-dev python3 gh
      - uses: actions/checkout@v7
      - name: Require free public-repository compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false
      - name: Build and verify Ubuntu ARM64 autofocus packages
        run: bash custom-build/ci/build-libcamera.sh
      - name: Check artifact storage budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.request
          def api(path):
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/{path}"
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          # The parallel kernel upload has its own guard. Wait for it, then
          # measure actual usage instead of double-reserving 100 MiB after it.
          for attempt in range(120):
              runs = api('actions/workflows/custom-kernel.yml/runs?branch=san-flavored&per_page=10')['workflow_runs']
              active = [r for r in runs if r['status'] != 'completed']
              if not active:
                  break
              print('Waiting for kernel artifact accounting', flush=True)
              time.sleep(30)
          else:
              raise SystemExit('Kernel upload did not finish within 60 minutes')
          used, page = 0, 1
          while True:
              artifacts = api(f'actions/artifacts?per_page=100&page={page}')['artifacts']
              used += sum(a['size_in_bytes'] for a in artifacts if not a['expired'])
              if len(artifacts) < 100:
                  break
              page += 1
          size = pathlib.Path('out/libcamera-san-v0.2.0-arm64.tar.gz').stat().st_size
          allowed = size <= 80 * 1024**2 and used + size + 2 * 1024**2 <= 400 * 1024**2
          print(f'Artifact storage {used / 1024**2:.1f} MiB; camera {size / 1024**2:.1f} MiB; cap 400 MiB')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('upload=' + str(allowed).lower() + '\n')
          if not allowed:
              raise SystemExit('Camera artifacts exceed the shared repository budget; build logs retained')
          PY
      - name: Upload autofocus packages and matching source
        if: steps.budget.outputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libcamera-san-v0.2.0-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/libcamera-san-v0.2.0-arm64.tar.gz
          compression-level: 0
          retention-days: 3
