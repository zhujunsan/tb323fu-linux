# SPDX-License-Identifier: MIT
name: Custom kernel baseline and integration
on:
  push:
    branches: [integration/gnome]
    paths: ['custom/**', 'custom-build/**', '.github/workflows/custom-kernel.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-kernel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Audit locked P0 candidates
        run: python3 custom-build/scripts/audit-p0.py
      - name: Install packaging regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cpio squashfs-tools busybox-static console-setup-linux wireless-regdb
      - name: Reproduce timestamp conflict and verify real initramfs packaging
        run: bash custom-build/tests/test-initramfs-packaging.sh
  baseline:
    needs: audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Record runner capacity
        run: |
          uname -a
          free -h
          df -h
      - name: Install native ARM64 build dependencies
        run: bash custom-build/ci/install-deps.sh
      - name: Build unchanged upstream kernel with unique CI identity
        env:
          BUILD_JOBS: '2'
        run: bash custom-build/scripts/build-kernel.sh baseline
      - name: Preserve artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/build-baseline/artifacts/
            out/build-baseline/build.log
            out/build-baseline/kout/.config
          include-hidden-files: true
          retention-days: 14
  integration:
    needs: baseline
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Install native ARM64 build dependencies
        run: bash custom-build/ci/install-deps.sh
      - name: Build Wi-Fi power saving, GPU and Iris fixes with Ubuntu security config
        env:
          BUILD_JOBS: '2'
        run: bash custom-build/scripts/build-kernel.sh integration
      - name: Preserve integration artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/build-integration/artifacts/
            out/build-integration/build.log
            out/build-integration/selected-patches.txt
            out/build-integration/kout/.config
          include-hidden-files: true
          retention-days: 14
