# SPDX-License-Identifier: MIT
name: san-flavored kernel
on:
  push:
    branches: [san-flavored]
    paths: ['custom/**', 'custom-build/**', '.github/workflows/custom-kernel.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Upload successful kernel outputs to this existing draft release
        type: string
        default: ''
      build_baseline:
        description: Also rebuild the original upstream baseline for an explicit investigation
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: custom-kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Audit locked custom patch stack
        run: python3 custom-build/scripts/audit-p0.py
      - name: Test artifact storage guard
        run: python3 -m unittest discover -s custom-build/tests -p 'test_*.py'
      - name: Test helper workspace against the locked dependencies
        run: cargo test --locked --manifest-path helper/Cargo.toml --workspace
      - name: Install packaging regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cpio squashfs-tools busybox-static console-setup-linux wireless-regdb
      - name: Reproduce timestamp conflict and verify real initramfs packaging
        run: bash custom-build/tests/test-initramfs-packaging.sh
  kernel:
    permissions:
      contents: write
      actions: read
    name: ${{ matrix.profile }}
    needs: audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.build_baseline && '["san-flavored","baseline"]' || '["san-flavored"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Read custom release identity
        id: version
        run: |
          python3 - <<'PY'
          import json, os
          v = json.load(open('custom/version.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('name=v' + v['version'] + '-' + v['upstream_kernel'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## san-flavored v' + v['version'] + ' / upstream ' + v['upstream_kernel'] + '\n')
          PY
      - name: Record runner capacity and require free public-repository compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false
          uname -a
          free -h
          df -h
      - name: Check free cache storage limit
        id: cache-policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=false
          if limit=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/storage-limit" --jq .max_cache_size_gb); then
            if [ "$limit" -le 10 ]; then enabled=true; fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "Remote cache enabled: $enabled (only with repository limit <= 10 GB)"
      - name: Restore compiler cache
        if: steps.cache-policy.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: out/ccache-${{ matrix.profile }}
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-llvm18-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-llvm18-${{ matrix.profile }}-
      - name: Install native ARM64 build dependencies
        run: bash custom-build/ci/install-deps.sh
      - name: Check requested draft release identity
        if: matrix.profile == 'san-flavored' && ((github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || format('san-{0}', steps.version.outputs.name) }}
        run: python3 custom-build/ci/stage-kernel-release.py --check
      - name: Build kernel and verify artifacts
        env:
          BUILD_JOBS: '4'
          USE_CCACHE: '1'
          PROFILE: ${{ matrix.profile }}
        run: bash custom-build/scripts/build-kernel.sh "$PROFILE"
      - name: Prepare artifacts within repository storage budget
        id: package
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ matrix.profile }}
          BUILD_RESULT: ${{ job.status }}
        run: python3 custom-build/ci/prepare-upload.py "$PROFILE" "$BUILD_RESULT"
      - name: Stage verified kernel in the requested draft release
        if: success() && matrix.profile == 'san-flavored' && ((github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || format('san-{0}', steps.version.outputs.name) }}
        run: python3 custom-build/ci/stage-kernel-release.py
      - name: Upload bounded artifacts and diagnostics
        if: always() && steps.package.outputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-${{ steps.version.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/upload-${{ matrix.profile }}/
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
